services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SGC_ENV: production
      SGC_ADMIN_USER: ${SGC_ADMIN_USER:?Set SGC_ADMIN_USER in .env}
      SGC_ADMIN_PASSWORD: ${SGC_ADMIN_PASSWORD:?Set SGC_ADMIN_PASSWORD in .env}
      SGC_ALLOW_REGISTRATION: ${SGC_ALLOW_REGISTRATION:-false}
      SGC_REGISTRATION_CODE: ${SGC_REGISTRATION_CODE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    volumes:
      - uploaded_documents:/app/data/uploads
      - standardized_drafts:/app/data/processed
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 45s
    networks:
      - backend
      - proxy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - proxy

volumes:
  postgres_data:
  uploaded_documents:
  standardized_drafts:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  proxy: